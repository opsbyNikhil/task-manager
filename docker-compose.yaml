services:

  task-manager-backend:
    image: task-manager-backend:${DOCKER_VERSION}

    build:
      context: ./backend/
      dockerfile: Dockerfile

    environment:
      - CORS_ALLOWED_ORIGINS=http://ae79b59bf3dd9456baad74cadc4714e7-1811664717.ap-southeast-1.elb.amazonaws.com:5173
    
    env_file:
      - ./backend/.env
    
    ports:
      - "8000:8000"
    
    networks:
      - task-manager-network
    
    restart:  always
    
    depends_on:
      - db-task-manager

  db-task-manager:
    image: mysql:8.0

    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3306:3306"
    
    networks:
      - task-manager-network
    
    volumes:
      - task-manager-db:/var/lib/mysql
    
    restart: always

  task-manager-frontend:
    image: task-manager-frontend:${DOCKER_VERSION}

    build:
      context: ./frontend/
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://ac9ed59ff99e543f29e7190d72cc1ae1-517013933.ap-southeast-1.elb.amazonaws.com:8000/api
    ports:
      - "5173:5173"
    networks:
      - task-manager-network
    restart:  always
    depends_on:
      - task-manager-backend
  
volumes:
  task-manager-db:

networks:
  task-manager-network:
    driver: bridge


