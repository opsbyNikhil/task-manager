services:

  task-manager-backend:
    image: task-manager-backend:${task_manager_backend}

    build:
      context: ./backend/
      dockerfile: Dockerfile
    environment:
      - CORS_ALLOWED_ORIGINS=http://54.254.120.73:5173
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - task_manager-network
    restart:  always
    depends_on:
      - db_task_manager

  db_task_manager:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_ROOT_PASSWORD: nikhil@12345
    ports:
      - "3306:3306"
    networks:
      - task_manager-network
    volumes:
      - task_manager_db:/var/lib/mysql
    restart: always

  task-manager-frontend:
    image: task_manager_frontend:${task_manager_frontend}

    build:
      context: ./frontend/
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://54.254.120.73:8000/api
    ports:
      - "5173:80"
    networks:
      - task_manager-network
    restart:  always
    depends_on:
      - db_task_manager
  
volumes:
  task_manager_db:

networks:
  task_manager-network:
    driver: bridge


